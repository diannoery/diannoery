<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Dian Noery, iOS Developer, Mobile and Web Development" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#141B30"/>
    </linearGradient>
    <linearGradient id="swift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#F0504B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0504B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F0504B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="screen"><rect x="1066" y="46" width="128" height="228" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1130" cy="160" r="230" fill="url(#glow)"/>

  <!-- Name and role -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="82" y="104" font-size="22" font-weight="400" fill="#7C879F">Hi there, I'm</text>
    <text x="80" y="170" font-size="78" font-weight="700" fill="#F5F7FB" letter-spacing="-2">Dian Noery</text>
    <text x="82" y="212" font-size="26" font-weight="500" fill="#C9D1E3">iOS Developer</text>
    <text x="82" y="244" font-size="18" font-weight="400" fill="#7C879F">Mobile &amp; Web Development</text>
    <rect x="82" y="266" width="56" height="4" rx="2" fill="url(#swift)"/>
  </g>

  <!-- Code card -->
  <g transform="translate(700 88)">
    <rect width="300" height="170" rx="14" fill="#0A0F1C" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="22" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="20" r="5" fill="#28C840"/>
    <g font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13">
      <text x="20" y="58"><tspan fill="#FF7AB2">struct</tspan><tspan fill="#DFE6F5"> </tspan><tspan fill="#5DD8FF">Developer</tspan><tspan fill="#DFE6F5"> {</tspan></text>
      <text x="38" y="82"><tspan fill="#FF7AB2">let</tspan><tspan fill="#DFE6F5"> name = </tspan><tspan fill="#FC6A5D">"Dian"</tspan></text>
      <text x="38" y="104"><tspan fill="#FF7AB2">let</tspan><tspan fill="#DFE6F5"> focus = [</tspan><tspan fill="#FC6A5D">"iOS"</tspan><tspan fill="#DFE6F5">, </tspan><tspan fill="#FC6A5D">"Web"</tspan><tspan fill="#DFE6F5">]</tspan></text>
      <text x="38" y="126"><tspan fill="#FF7AB2">var</tspan><tspan fill="#DFE6F5"> ships = </tspan><tspan fill="#FF7AB2">true</tspan></text>
      <text x="20" y="148" fill="#DFE6F5">}</text>
    </g>
  </g>

  <!-- Phone -->
  <g>
    <rect x="1056" y="36" width="148" height="248" rx="26" fill="#0A0F1C" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <g clip-path="url(#screen)">
      <rect x="1066" y="46" width="128" height="228" fill="#111A30"/>
      <rect x="1066" y="46" width="128" height="228" fill="url(#glow)" opacity="0.6"/>
      <!-- balance card -->
      <rect x="1078" y="84" width="104" height="64" rx="12" fill="url(#swift)"/>
      <rect x="1088" y="98" width="36" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
      <rect x="1088" y="116" width="72" height="10" rx="5" fill="#FFFFFF"/>
      <!-- list rows -->
      <rect x="1078" y="162" width="28" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="1114" y="168" width="52" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="1114" y="180" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="1078" y="200" width="28" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="1114" y="206" width="60" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="1114" y="218" width="28" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
    </g>
    <rect x="1104" y="52" width="52" height="14" rx="7" fill="#0A0F1C"/>
    <rect x="1112" y="268" width="36" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
